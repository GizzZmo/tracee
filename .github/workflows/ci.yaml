#
# CI Workflow - Runs on push to main branch
#
name: CI
on:
  workflow_dispatch: {}
  push:
    branches:
      - "main"
      - "release-v*.*.*"
    paths:
      - "!docs/**"
      - "!deploy/**"
      - "!packaging/**"
      - "!**.yaml"
      - "!**.md"
      - "!**.txt"
      - "!**.conf"
      # override previous rules:
      - "docs/docs/flags/**"
      - "docs/man/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "**.c"
      - "**.h"
      - "**.go"
      - "**.sh"
      - "**.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  #
  # CODE VERIFICATION
  #
  verify-code:
    name: Verify Code
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: alpine/git:2.49.1@sha256:bd54f921f6d803dfa3a4fe14b7defe36df1b71349a3e416547e333aa960f86e3
    steps:
      - name: Checkout Code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: true
      - name: Fix Git ownership
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
        shell: sh
      - name: Install Dependencies
        run: ./scripts/installation/install-deps-alpine.sh
        shell: sh
      - name: Check Code Formatting
        run: |
          if test -z "$(gofmt -l .)"; then
            echo "Congrats! There is nothing to fix."
          else
            echo "The following lines should be fixed."
            gofmt -s -d .
            exit 1
          fi
      - name: Lint (Revive)
        run: |
          make check-lint
      - name: Check Code Style
        run: |
          make check-fmt
      - name: Check Golang Vet
        run: |
          make check-vet

  #
  # BUILD VERIFICATION
  #
  build:
    name: Build Tracee
    needs: verify-code
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: alpine/git:2.49.1@sha256:bd54f921f6d803dfa3a4fe14b7defe36df1b71349a3e416547e333aa960f86e3
    steps:
      - name: Checkout Code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: true
      - name: Fix Git ownership
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
        shell: sh
      - name: Install Dependencies
        run: ./scripts/installation/install-deps-alpine.sh
        shell: sh
      - name: Build Tracee
        run: |
          make clean
          make tracee
      - name: Build Additional Tools
        run: |
          make tracee-bench
          make e2e-net-signatures
          make e2e-inst-signatures

  #
  # UNIT TESTS
  #
  unit-tests:
    name: Unit Tests
    needs: verify-code
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: alpine/git:2.49.1@sha256:bd54f921f6d803dfa3a4fe14b7defe36df1b71349a3e416547e333aa960f86e3
    steps:
      - name: Checkout Code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: true
          fetch-depth: 0
      - name: Fix Git ownership
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
        shell: sh
      - name: Install Dependencies
        run: ./scripts/installation/install-deps-alpine.sh
        shell: sh
      - name: Run Unit Tests
        run: |
          make test-unit
      - name: Upload Coverage
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          flags: unit
          name: unit-tests
          fail_ci_if_error: false

  #
  # INTEGRATION TESTS
  #
  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: ubuntu:24.04@sha256:353675e2a41babd526e2b837d7ec780c2a05bca0164f7ea5dbbd433d21d166fc
      options: --pid=host --cgroupns=host --privileged -v /etc/os-release:/etc/os-release-host:ro -v /var/run:/var/run:ro -v /sys/kernel/debug:/sys/kernel/debug:rw -v /boot:/boot:ro
    steps:
      - name: Install Git
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends git-core ca-certificates
          update-ca-certificates
      - name: Checkout Code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: true
          fetch-depth: 0
      - name: Fix Git ownership
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Install Dependencies
        run: ./scripts/installation/install-deps-ubuntu.sh
      - name: Run Integration Tests
        run: |
          env "PATH=$PATH" make test-integration
      - name: Upload Coverage
        uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./integration-coverage.txt
          flags: integration
          name: integration-tests
          fail_ci_if_error: false
